# Virtual output that stream-3ds sends to the 3DS remote app.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "3ds"
            node.description = "Nintendo 3DS"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
        }
    }
]
