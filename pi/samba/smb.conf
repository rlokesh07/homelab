[global]
   server role = standalone server
   map to guest = never
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1
   max log size = 1000

   # macOS clients. /mnt/storage is sshfs, which has no extended attributes, so xattr_tdb
   # keeps Finder metadata in /var/lib/samba on the Pi. streams_depot does not work here:
   # it still needs an xattr on each file and keeps moving metadata into lost-* folders.
   vfs objects = catia fruit streams_xattr xattr_tdb
   fruit:metadata = stream
   fruit:resource = stream
   fruit:model = MacSamba
   fruit:veto_appledouble = yes
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[storage]
   path = /mnt/storage
   valid users = alarcafil
   force user = alarcafil
   read only = no
   create mask = 0644
   directory mask = 0755
   veto files = /.DS_Store/._*/
   delete veto files = yes
